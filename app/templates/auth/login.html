{% extends 'base.html' %}

{% block title %}Iniciar sesión — S.A.D.E.{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h1 class="mb-4">Iniciar sesión</h1>
        <form method="POST">
            <div class="mb-3">
                <label for="nombre_usuario" class="form-label">Usuario</label>
                <input
                    type="text"
                    class="form-control"
                    id="nombre_usuario"
                    name="nombre_usuario"
                    required
                    autofocus
                >
            </div>
            <div class="mb-3">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input
                    type="password"
                    class="form-control"
                    id="contrasena"
                    name="contrasena"
                    required
                >
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
